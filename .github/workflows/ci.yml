# Lints and starts a fresh install to make sure a clone still boots, stylesheet build included
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Chrome is only needed for the web tools, never at startup
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - name: Start a fresh install and render its setup page
        run: |
          # Nothing is configured: the server comes up and sends the first visitor to setup
          bun run app.js > server.log 2>&1 &
          server=$!
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8005/setup; then
              echo "The server answered; its log:"
              cat server.log
              kill "$server"
              exit 0
            fi
            sleep 0.5
          done
          echo "The server didn't answer within 30 seconds; its log:"
          cat server.log
          kill "$server" || true
          exit 1
